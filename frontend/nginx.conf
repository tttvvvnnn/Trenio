server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Живые обновления: WebSocket. Соединение начинается как HTTP-запрос с заголовком
    # Upgrade, и nginx должен передать его дальше по HTTP/1.1, иначе backend получит
    # обычный запрос. Таймауты по умолчанию (60 с) не мешают: backend шлёт ping раз в 20 с
    location = /api/ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API, проверка здоровья и webhook бота уходят в backend
    location ~ ^/(api/|bot/|health$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Файлы с хэшем в имени можно кэшировать навсегда
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Всё остальное считаем страницей Mini App
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
