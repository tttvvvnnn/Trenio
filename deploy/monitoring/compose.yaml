# Uptime Kuma: свой мониторинг Trenio без внешних сервисов.
# Живёт НЕ на VPS с Trenio (сервер с панелью Remnawave), чтобы видеть падение VPS целиком.
# Проверяет /health dev и prod, принимает «пульс» ночного бэкапа и шлёт алерты в Telegram.
# На сервере: /opt/monitoring/compose.yaml, запуск: docker compose up -d
#
# Порт 3001 слушает только 127.0.0.1 и снаружи не виден.
# Веб-интерфейс: SSH-туннель ssh -L 3001:127.0.0.1:3001 <сервер>, затем http://localhost:3001
# Наружу открыт только /api/push/ через nginx сервера: см. nginx-push.conf рядом.
name: monitoring

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - kuma-data:/app/data
    mem_limit: 256m
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

volumes:
  kuma-data:
