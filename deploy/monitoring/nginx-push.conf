# Вставить внутрь server { ... } c доменом в nginx сервера мониторинга.
# Открывает наружу ТОЛЬКО приём «пульса» бэкапа (push-мониторы Kuma).
# Веб-интерфейс Kuma по-прежнему доступен лишь через SSH-туннель.
location /api/push/ {
    allow 171.22.130.89;   # VPS с Trenio, откуда шлёт backup.sh
    deny all;

    # nginx на хосте или в контейнере с network_mode: host.
    # Если nginx в контейнере в своей docker-сети: подключи uptime-kuma к этой сети
    # и пиши proxy_pass http://uptime-kuma:3001;
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
