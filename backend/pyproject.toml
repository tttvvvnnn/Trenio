[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trenio"
version = "0.1.0"
description = "Backend Trenio: API, бот и планировщик"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/trenio"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
