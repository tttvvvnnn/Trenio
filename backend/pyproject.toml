[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trenio"
version = "0.15.0"
description = "Backend Trenio: API, бот и планировщик"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    # Запросы к платёжной системе Platega
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "sqlalchemy[asyncio]>=2.0.30",
    # База часовых поясов для zoneinfo: в slim-образе системной может не быть
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trenio"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
